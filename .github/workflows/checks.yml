name: Check plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_ow_stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r astrbot_plugin_ow_stats/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest astrbot_plugin_ow_stats.tests.test_core astrbot_plugin_ow_stats.tests.test_public_boundaries astrbot_plugin_ow_stats.tests.test_render -v
      - name: Audit pinned plugin dependencies
        run: |
          python -m venv "$RUNNER_TEMP/ow-plugin-audit"
          "$RUNNER_TEMP/ow-plugin-audit/bin/python" -m pip install -q pip-audit==2.10.1
          "$RUNNER_TEMP/ow-plugin-audit/bin/python" -m pip_audit --disable-pip --no-deps --strict -r astrbot_plugin_ow_stats/requirements.txt
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_ow_stats
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.29.1
          path: AstrBot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./AstrBot -r astrbot_plugin_ow_stats/requirements.txt
      - run: python -m unittest astrbot_plugin_ow_stats.tests.test_commands -v
