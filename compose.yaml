name: astrbot-ow-stats
services:
  astrbot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:6185:6185"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/AstrBot/data
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: "512mb"
    mem_limit: "768m"
    memswap_limit: "1536m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
